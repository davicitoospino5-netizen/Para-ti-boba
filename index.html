<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Girasoles bajo la noche</title>
<meta name="theme-color" content="#0a0e27">
<style>
  :root{
    --sky-top:#05060f;
    --sky-mid:#0d1230;
    --sky-bottom:#1a2454;
    --petal:#ffd23f;
    --petal-shadow:#f4a400;
    --petal-glow:#fff4c2;
    --center-dark:#3b2410;
    --center-mid:#6b3f14;
    --leaf:#3f7d3a;
    --leaf-dark:#2c5a29;
    --star:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:var(--sky-top);
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sky{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at 50% 0%, var(--sky-mid) 0%, var(--sky-top) 55%),
      linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
    overflow:hidden;
  }
  /* twinkling stars */
  .stars{
    position:absolute;
    inset:0;
  }
  .stars span{
    position:absolute;
    width:2px;
    height:2px;
    background:var(--star);
    border-radius:50%;
    opacity:.7;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.9;}
  }
  /* shooting stars */
  .shooting{
    position:absolute;
    width:120px;
    height:2px;
    background:linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0));
    border-radius:2px;
    transform:rotate(-35deg);
    opacity:0;
    animation:shoot 5.5s linear infinite;
  }
  @keyframes shoot{
    0%{ transform:translate(0,0) rotate(-35deg); opacity:0; }
    3%{ opacity:1; }
    18%{ transform:translate(-420px,300px) rotate(-35deg); opacity:0; }
    100%{ opacity:0; }
  }
  .shooting.s1{top:8%; left:85%; animation-delay:0s;}
  .shooting.s2{top:18%; left:60%; animation-delay:1.8s; width:90px;}
  .shooting.s3{top:2%; left:100%; animation-delay:3.4s; width:140px;}
  .shooting.s4{top:30%; left:40%; animation-delay:5s; width:80px;}

  .scene{
    position:relative;
    width:min(92vw, 620px);
    aspect-ratio:3/4;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:2;
  }

  svg.bouquet{
    width:100%;
    height:100%;
    overflow:visible;
    animation:rise 1.4s cubic-bezier(.19,1,.22,1) both, sway 6s ease-in-out 1.4s infinite;
    transform-origin:50% 100%;
  }
  @keyframes rise{
    from{ transform:translateY(40px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  @keyframes sway{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(0.6deg); }
  }

  .flower-glow{
    filter:drop-shadow(0 0 18px rgba(255,210,63,0.55)) drop-shadow(0 0 40px rgba(255,180,30,0.25));
  }

  .caption{
    position:fixed;
    bottom:calc(4vh + env(safe-area-inset-bottom,0px));
    left:0;
    right:0;
    text-align:center;
    z-index:3;
    color:#f4e9c9;
    font-family:Georgia, 'Times New Roman', serif;
    font-size:clamp(14px, 3.6vw, 19px);
    letter-spacing:.03em;
    opacity:0;
    animation:fadein 1.5s ease-out 1s forwards;
    padding:0 24px;
  }
  @keyframes fadein{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .shooting, .stars span, svg.bouquet{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="sky">
  <div class="stars" id="stars"></div>
  <div class="shooting s1"></div>
  <div class="shooting s2"></div>
  <div class="shooting s3"></div>
  <div class="shooting s4"></div>
</div>

<div class="scene">
  <svg class="bouquet flower-glow" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="petalGrad" cx="50%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#fff4c2"/>
        <stop offset="55%" stop-color="#ffd23f"/>
        <stop offset="100%" stop-color="#f4a400"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="45%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#8a5a20"/>
        <stop offset="60%" stop-color="#5a3414"/>
        <stop offset="100%" stop-color="#2e1c0c"/>
      </radialGradient>
      <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4f9a48"/>
        <stop offset="100%" stop-color="#2c5a29"/>
      </linearGradient>
      <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4f9a48"/>
        <stop offset="100%" stop-color="#2c5a29"/>
      </linearGradient>
    </defs>

    <!-- stems -->
    <g stroke="url(#stemGrad)" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M200 500 C198 420, 175 360, 155 300"/>
      <path d="M200 500 C202 410, 210 340, 205 260"/>
      <path d="M200 500 C205 430, 235 370, 255 305"/>
      <path d="M200 500 C190 440, 150 400, 110 345"/>
      <path d="M200 500 C210 445, 255 405, 295 350"/>
    </g>

    
    <!-- bottom leaves 
     -->
    <g fill="url(#leafG
    rad)">
      <path d="M170 470 C130 460, 95 480, 80 445 C120 440, 150 445, 170 470 Z"/>
      <path d="M170 490 C140 490, 115 505, 105 480 C135 475, 155 478, 170 490 Z"/>
      <path d="M230 470 C270 460, 305 480, 320 445 C280 440, 250 445, 230 470 Z"/>
      <path d="M225 495 C255 500, 275 515, 290 495 C260 488, 240 490, 225 495 Z"/>
    </g>

    <!-- small side leaves on stems -->
    <g fill="url(#leafGrad)">
      <path d="M160 360 C130 355, 115 375, 130 390 C145 380, 155 370, 160 360 Z"/>
      <path d="M245 340 C275 333, 292 352, 278 368 C263 358, 252 350, 245 340 Z"/>
      <path d="M140 400 C112 400, 100 420, 118 432 C130 420, 137 410, 140 400 Z"/>
    </g>

    <!-- FLOWER template as reusable group -->
    <g id="flowerGroup">
      <g id="petals">
        <!-- 10 petals around center -->
      </g>
      <circle cx="0" cy="0" r="22" fill="url(#centerGrad)"/>
      <g stroke="#1c1006" stroke-width="1" opacity="0.5">
        <circle cx="0" cy="0" r="16"/>
        <circle cx="0" cy="0" r="10"/>
        <circle cx="0" cy="0" r="4"/>
      </g>
    </g>

    <!-- Flower 1 - top left -->
    <use href="#flowerGroup" transform="translate(155,110) scale(0.85)"/>
    <!-- Flower 2 - top right, largest -->
    <use href="#flowerGroup" transform="translate(255,95) scale(1.05)"/>
    <!-- Flower 3 - center, biggest, front -->
    <use href="#flowerGroup" transform="translate(205,190) scale(1.15)"/>
    <!-- Flower 4 - bottom left -->
    <use href="#flowerGroup" transform="translate(115,255) scale(0.9)"/>
    <!-- Flower 5 - bottom right -->
    <use href="#flowerGroup" transform="translate(290,255) scale(0.9)"/>
  </svg>
</div>

<div class="caption">Para ti 🌻</div>

<script>
  // Generate background stars
  const starsContainer = document.getElementById('stars');
  const starCount = 90;
  for(let i=0;i<starCount;i++){
    const s = document.createElement('span');
    s.style.top = Math.random()*100+'%';
    s.style.left = Math.random()*100+'%';
    const size = Math.random()*1.5+1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.animationDuration = (2+Math.random()*3)+'s';
    starsContainer.appendChild(s);
  }

  // Build petals for each flower using the template
  const petalPaths = [];
  const numPetals = 11;
  const outerR = 95, innerR = 26, petalWidth = 32;
  let petalMarkup = '';
  for(let i=0;i<numPetals;i++){
    const angle = (i/numPetals) * Math.PI * 2;
    const nextAngle = angle + (petalWidth * Math.PI/180);
    const tipX = Math.cos(angle) * outerR;
    const tipY = Math.sin(angle) * outerR;
    const baseX1 = Math.cos(angle - 0.28) * innerR;
    const baseY1 = Math.sin(angle - 0.28) * innerR;
    const baseX2 = Math.cos(angle + 0.28) * innerR;
    const baseY2 = Math.sin(angle + 0.28) * innerR;
    const ctrlX1 = Math.cos(angle - 0.15) * (outerR*0.6);
    const ctrlY1 = Math.sin(angle - 0.15) * (outerR*0.6);
    const ctrlX2 = Math.cos(angle + 0.15) * (outerR*0.6);
    const ctrlY2 = Math.sin(angle + 0.15) * (outerR*0.6);
    petalMarkup += `<path d="M ${baseX1} ${baseY1} Q ${ctrlX1} ${ctrlY1} ${tipX} ${tipY} Q ${ctrlX2} ${ctrlY2} ${baseX2} ${baseY2} Z" fill="url(#petalGrad)" stroke="#e0940a" stroke-width="0.6"/>`;
  }
  document.getElementById('petals').innerHTML = petalMarkup;
</script>

</body>
</html>
